<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guinzly Basketboy Player 🐧🏀</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3e6;--fg:#4a2a22;--card:#ffffff;--ac:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1f2d;--fg:#fbe9dc;--card:#43324a}}
:root[data-theme="dark"]{--bg:#2a1f2d;--fg:#fbe9dc;--card:#43324a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Mali,"Noto Sans Thai",system-ui,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#wrap{position:relative;width:min(100vw,calc(100dvh*.5625));height:min(100dvh,calc(100vw*1.7778));margin:0 auto}
canvas{width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;text-align:center;background:color-mix(in srgb,var(--bg) 94%,transparent);overflow:auto}
.ov[hidden]{display:none}
h1{font-size:28px;margin:0}h2{margin:0}p{margin:0;line-height:1.5}
.btn{font:inherit;font-weight:700;border:0;border-radius:18px;padding:12px 24px;background:var(--ac);color:#fff;font-size:18px;box-shadow:0 4px 0 #7e251c;cursor:pointer}
.btn.alt{background:#8e7cc3;box-shadow:0 4px 0 #5e4e8c}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.lc{font:inherit;color:var(--fg);background:var(--card);border:2px solid #e0b9a0;border-radius:16px;padding:10px 8px;text-align:center;cursor:pointer;font-size:14px}
.lc b{display:block;font-size:15px}.lc small{opacity:.75;font-size:12px}
.lc:disabled{opacity:.4;cursor:default}
#bk{position:absolute;left:8px;top:calc(8px + env(safe-area-inset-top,0px));width:38px;height:38px;border-radius:12px;border:0;background:rgba(255,255,255,.8);font-size:18px;cursor:pointer}
input{font:inherit;font-size:18px;text-align:center;padding:10px 14px;border-radius:16px;border:2px solid #e0b9a0;background:var(--card);color:var(--fg);width:min(260px,80%)}
.card{background:var(--card);border-radius:26px;padding:22px 20px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:pop .5s cubic-bezier(.3,1.6,.5,1);display:flex;flex-direction:column;align-items:center;gap:12px;max-width:300px}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.ttl{font-size:32px;line-height:1.15;color:var(--ac);text-shadow:0 3px 0 #ffd6a5,0 6px 12px rgba(192,57,43,.25)}
.sub{font-size:13px;opacity:.8}
.nl{font-weight:700;font-size:17px;color:#8e7cc3;line-height:1.4}.nl small{display:block;font-size:14px;color:var(--fg);opacity:.85}
.arr{font-size:34px;line-height:1;margin:-4px 0}
.fl{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fl span{position:absolute;font-size:24px;opacity:.55;animation:fy 4s infinite alternate ease-in-out}
@keyframes fy{to{transform:translateY(-16px) rotate(12deg)}}
.bounce{animation:bn .9s infinite alternate ease-in-out}@keyframes bn{to{transform:translateY(-14px)}}
.fc{perspective:700px;aspect-ratio:3/4;cursor:pointer;transition:opacity .4s}
.fc.dim{opacity:.3}
.fi{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.fc.on .fi{transform:rotateY(180deg)}
.ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 6px 14px rgba(0,0,0,.28);overflow:hidden;box-sizing:border-box}
.fb{background:repeating-linear-gradient(45deg,#8e7cc3,#8e7cc3 10px,#a595d6 10px,#a595d6 20px);border:3px solid #fff;font-size:44px}
.fb small{font-size:13px;font-weight:700;color:#fff}
.fr{transform:rotateY(180deg);background:var(--card);border:3px solid #ffd54a;padding:6px;font-size:13px;font-weight:700;text-align:center}
.fr img{max-width:100%;max-height:68%;object-fit:contain;border-radius:10px}
.rare,.fr.rare{border:4px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#fff2a8,#d4a017 30%,#fff2a8 55%,#b8860b) border-box;box-shadow:0 0 16px 4px rgba(255,200,40,.75)}
.rb{font-size:14px;font-weight:900;color:#7a4e00;background:linear-gradient(90deg,#ffe27a,#fff8d6,#ffe27a);padding:2px 12px;border-radius:999px;letter-spacing:1.5px;border:1.5px solid #d4a017}
#lv{justify-content:flex-start;padding:12px 12px 16px;gap:8px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#lv>*{flex-shrink:0}
#lv h2{font-size:20px}
#lv .grid{gap:6px}
#lv .lc{padding:5px 5px;border-radius:12px;font-size:11px;line-height:1.25;border-width:1.5px}
#lv .lc b{font-size:12.5px}
#lv .lc small{font-size:10px}
#lv .btn{font-size:15px;padding:8px 18px}
</style></head><body>

function beep(f,d,ty){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),n=AC.createGain();o.type=ty||'sine';o.frequency.value=f;n.gain.value=.06;o.connect(n);n.connect(AC.destination);o.start();n.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}

function warnGo(i){const r=$('res');r.style.background='rgba(16,6,30,.97)';r.innerHTML='<div class="card" style="background:#2b1243;color:#ffd7a8"><div class="bounce" style="font-size:64px">🎃👻</div><h2 style="color:#ff9f43">🌙 คืนฮาโลวีนมาถึงแล้ว... 🎃</h2><p>ด่านนี้มืดๆ ไฟติดๆ ดับๆ 💡<br>แล้วจะมีกุ๊กกู๋ 👻 โผล่มาหลอกบ้างๆ นะ<br>🦇 เตรียมใจให้พร้อมน้า 🕸️</p><button class="btn" id="wy">🎃 กล้าเข้า!</button><button class="btn alt" id="wn">🙈 ยังก่อนดีกว่า</button></div>';show('res');$('wy').onclick=()=>{r.style.background='';start(i)};$('wn').onclick=()=>{r.style.background='';allDone()?menuLv():show('menu')}}

function start(i){cur=i;L=Object.assign({sh:6,nd:3,my:0,mx:0,bl:0,wd:0},LV[i]);S={score:0,shots:L.sh,combo:0,st:'ready',time:0,ct:0,jt:-1,ball:null,wait:0,pops:[],pts:[],cheer:0,net:0,wind:0,rel:0,gh:[],gt:2.5,boo:0,sq:3,spl:0};newShot();show(null);$('bk').hidden=!allDone();run=true}
function newShot(){S.pz=.3+.4*Math.random();S.st='ready';S.ct=S.ct%2;S.wind=L.wd?(Math.random()<.5?-1:1)*L.wd*(.5+.5*Math.random()):0}
function hoop(t){return{x:L.hx+(L.mx?L.mx*Math.sin(t*1.1):0),y:L.hy+(L.my?L.my*Math.sin(t*1.3+1):0)}}
const cat=t=>({x:L.bx||172,y:485-170*Math.abs(Math.sin(t*1.5))});
const cursor=()=>Math.abs((S.ct%2)-1);
const flick=T=>{let a=.45+.1*Math.sin(T*1.7);if(Math.sin(T*9)*Math.sin(T*2.3)>.5)a=.2;if(Math.sin(T*13.1+1)>.92||Math.sin(T*5.3)>.97)a=.7;return a};
const X0=89,Y0=FL+6-JH-101,SC=.2935;
function sprite(im,bw,bh,x,bot,k){const w=bw*SC,h=bh*SC;ctx.save();ctx.translate(x,bot);ctx.scale(1,k);ctx.drawImage(im,-w/2,-h,w,h);ctx.restore()}
function shoot(){
 const p=cursor();let Tf=.65,v=400;
 for(let k=0;k<5;k++){const h=hoop(S.time+JT/2+Tf),dx=h.x-X0,dy=Y0-h.y,d=dx*Math.tan(TH)-dy;v=Math.sqrt(G*dx*dx/(2*Math.cos(TH)**2*d));Tf=dx/(v*Math.cos(TH))}
 S.v=v*((1-.9*S.pz)+p*.9);S.st='busy';S.jt=0;S.rel=0;S.shots--;beep(520,.08);
}
cv.addEventListener('pointerdown',()=>{if(run&&S.st==='ready'&&S.time>.6)shoot()});
addEventListener('keydown',e=>{if(e.code==='Space'&&run&&S.st==='ready'&&S.time>.6){e.preventDefault();shoot()}});
function pop(t,x,y){S.pops.push({t,x,y,l:1})}
function update(dt){
 S.time+=dt;S.cheer=Math.max(0,S.cheer-dt);S.net=Math.max(0,S.net-dt);
 if(S.st==='ready')S.ct+=dt*L.sp;
 if(S.jt>=0){S.jt+=dt;if(!S.rel&&S.jt>=JT/2){S.rel=1;const a=TH;S.ball={x:X0,y:Y0,vx:S.v*Math.cos(a),vy:-S.v*Math.sin(a),py:Y0,a:0,sc:0,rim:0,bk:0}}if(S.jt>JT)S.jt=-1}
 const b=S.ball;
 if(b){
  b.py=b.y;b.vy+=G*dt;b.vx+=S.wind*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=b.vx*dt*.05;
  const h=hoop(S.time);
  if(!b.sc){
   for(const rx of[h.x-RW,h.x+RW]){const dx=b.x-rx,dy=b.y-h.y,d=Math.hypot(dx,dy);if(d<R+4&&d>0){const nx=dx/d,ny=dy/d;b.x=rx+nx*(R+4);b.y=h.y+ny*(R+4);const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.5*vn*nx;b.vy-=1.5*vn*ny;b.rim=1;beep(200,.06,'square')}}}
   if(b.x+R>h.x+RW+6&&b.x<h.x+RW+14&&b.y>h.y-62&&b.y<h.y+8&&b.vx>0){b.x=h.x+RW+6-R;b.vx=-b.vx*.5;b.rim=1;beep(160,.06,'square')}
   if(b.py<h.y&&b.y>=h.y&&Math.abs(b.x-h.x)<RW-5&&b.vy>0){
    b.sc=1;S.score++;S.combo++;S.cheer=1.2;S.net=.5;b.vx*=.3;b.vy*=.5;
    pop(b.rim?pick(['Lucky~! 🍀','Phew! 😆','Boing-in! 🏀']):pick(['Swish! ✨','Nice shot! 💖','So cute! 🌸','Sweet! 🍓','Yay~! 🎀','Purrfect! 😽']),h.x-30,h.y-40);if(S.combo>1)pop('Combo x'+S.combo+' 🔥',W/2,250);
    beep(660,.1);setTimeout(()=>beep(880,.14),90);
    for(let i=0;i<22;i++)S.pts.push({x:h.x,y:h.y,vx:(Math.random()-.5)*300,vy:-Math.random()*300,c:HEAD[i%7],l:1.1});
   }
  }

function pickCards(g,cb){
 g.style.justifyContent='flex-start';g.scrollTop=0;
 let h='<h2 style="margin-top:6px">🃏 เลือกการ์ด 1 ใบ</h2><p class="sub">แตะการ์ดที่ใช่ เพื่อพลิกดูของรางวัล ✨</p><div class="grid" id="cg" style="margin-bottom:12px">';
 for(let i=0;i<REW.length;i++)h+='<div class="fc" data-i="'+i+'"><div class="fi"><div class="ff fb">🐧<small>การ์ด '+(i+1)+'</small></div><div class="ff fr"></div></div></div>';
 g.innerHTML=h+'</div>';
 let done=false;
 g.querySelectorAll('.fc').forEach(c=>c.onclick=()=>{
  if(done)return;done=true;
  let t=Math.random()*REW.reduce((a,x)=>a+x.w,0),r=REW[0];for(const x of REW){if((t-=x.w)<0){r=x;break}}
  const fr=c.querySelector('.fr');if(r.k==='josh')fr.classList.add('rare');fr.innerHTML=(r.k==='josh'?'<div class="rb">✨ RARE ✨</div>':'')+'<img src="'+r.img+'" alt="">'+'<span>'+r.n+'</span>';
  g.querySelectorAll('.fc').forEach(o=>{if(o!==c)o.classList.add('dim')});
  beep(660,.12);c.classList.add('on');
  setTimeout(()=>{g.style.justifyContent='';cb(r)},1800);
 });
}
